[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gimp-mcp"
version = "0.2.0"
description = "GIMP MCP integration for external control of GIMP 3.2"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "fastmcp>=2.10,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/Ryan-AI-Studios/gimp-mcp"
Source = "https://github.com/Ryan-AI-Studios/gimp-mcp"
Changelog = "https://github.com/Ryan-AI-Studios/gimp-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Ryan-AI-Studios/gimp-mcp/blob/main/README.md"
Issues = "https://github.com/Ryan-AI-Studios/gimp-mcp/issues"

[project.scripts]
gimp-mcp-server = "gimp_mcp_server:main"
gimp-agent = "gimp_agent.cli:main"

[tool.setuptools]
py-modules = [
    "gimp_mcp_server",
    "gimp_mcp_security",
    "gimp_mcp_snapshot",
    "gimp_mcp_export",
    "gimp_mcp_state",
    "gimp_mcp_handles",
    "gimp_mcp_coords",
    "gimp_mcp_policy",
    "gimp_mcp_atomic",
    "gimp_mcp_surface",
    "gimp_mcp_verify",
    "gimp_mcp_recipes",
    "gimp_mcp_filters",
    "gimp_mcp_tx",
]
packages = ["gimp_agent"]

[tool.setuptools.package-data]
gimp_agent = ["recipes/*.json"]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pre-commit>=4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format) — pinned to match STL / current PyPI as of 2026-08-02
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "gimp_agent", "tests"]
# Full product Python surface is in scope. Governance / local agent dirs stay out.
# .venv/.git/__pycache__ are covered by Ruff defaults; list governance dirs only.
# Markdown: ruff format rewrites fenced code blocks; we do not format docs via ruff.
extend-exclude = [
    ".agents",
    "conductor",
    ".ledgerful",
    "docs",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    # Retained global: ~79 raise-without-from in gimp_mcp_server tool wrappers.
    # Tried remove in 0002 → flood; defer exception-chaining cleanup (see deferred.md).
    "B904",
    # Retained global: long lines in tool docstrings / generated-style wrappers.
    # Tried remove in 0002 → flood; defer dedicated line-wrap pass (see deferred.md).
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "gimp_mcp_server",
    "gimp_mcp_security",
    "gimp_mcp_snapshot",
    "gimp_mcp_export",
    "gimp_mcp_state",
    "gimp_mcp_handles",
    "gimp_mcp_coords",
    "gimp_mcp_policy",
    "gimp_mcp_atomic",
    "gimp_mcp_surface",
    "gimp_mcp_verify",
    "gimp_mcp_recipes",
    "gimp_mcp_filters",
    "gimp_mcp_tx",
    "gimp_agent",
]

[tool.ruff.lint.per-file-ignores]
# GIMP plug-in bootstrap: gi.require_version must precede gi.repository imports.
# Do not reorder imports to silence E402; ignore I so isort cannot reshuffle bootstrap.
# RUF001/RUF002: keep box-drawing / typographic unicode in UI and comments (no ASCII-ization).
"gimp-mcp-plugin.py" = ["E402", "I", "RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# basedpyright — type check MCP server + tests; GIMP plugin is runtime-only
# ---------------------------------------------------------------------------
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Typed surface: MCP server + unit tests only.
# Permanent exclude: gimp-mcp-plugin.py (GIMP-embedded gi.repository — no host stubs).
# Demos / scripts / live GIMP CLIs are runtime-only, not library-typed.
include = [
    "gimp_mcp_server.py",
    "gimp_mcp_security.py",
    "gimp_mcp_snapshot.py",
    "gimp_mcp_export.py",
    "gimp_mcp_state.py",
    "gimp_mcp_handles.py",
    "gimp_mcp_coords.py",
    "gimp_mcp_policy.py",
    "gimp_mcp_atomic.py",
    "gimp_mcp_surface.py",
    "gimp_mcp_verify.py",
    "gimp_mcp_recipes.py",
    "gimp_mcp_filters.py",
    "gimp_mcp_tx.py",
    "gimp_agent",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "gimp-mcp-plugin.py",
    "scripts/**",
    "agent_edit_demo.py",
    "bg_remove.py",
    "bg_remove_iterative.py",
    "run_tests.py",
    ".agents",
    "conductor",
    ".ledgerful",
]
reportMissingImports = true
reportMissingTypeStubs = false
# Load-bearing dials for usable standard mode with mcp/fastmcp stubs.
# Candidate for a later type-hardening track — not 0002.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportAny = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live GIMP scripts live under scripts/ (not collected). Keep output/ out of discovery.
norecursedirs = [".git", ".venv", "files", "output"]
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
    "integration: requires live GIMP MCP plugin on localhost:9877",
    "slow: long-running or heavy image fixtures",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
